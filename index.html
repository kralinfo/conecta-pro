<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaPro — Guia de Profissionais</title>

  <!-- Meta tags Open Graph para visualização ao compartilhar no WhatsApp -->
  <meta name="description" content="Encontre profissionais de confiança na sua cidade ou divulgue gratuitamente seus serviços." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ConectaPro — Guia de Profissionais" />
  <meta property="og:description" content="Encontre pedreiros, eletricistas, encanadores, pintores, diaristas e muito mais na sua cidade, ou cadastre seu trabalho gratuitamente." />
  <meta property="og:locale" content="pt_BR" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col selection:bg-emerald-100 selection:text-emerald-900">

  <!-- =========================================================
       CABEÇALHO MÍNIMO
       ========================================================= -->
  <header class="w-full bg-white/90 backdrop-blur border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <!-- Logotipo clicável à esquerda -->
      <button
        type="button"
        id="btn-logo-home"
        class="flex items-center gap-2.5 text-left group focus:outline-none rounded-xl p-1 -ml-1 cursor-pointer"
        title="Voltar para a tela inicial"
      >
        <span class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-sm group-hover:bg-emerald-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </span>
        <span class="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900">
          Conecta<span class="text-emerald-600">Pro</span>
        </span>
      </button>

      <!-- Ações do header -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          id="btn-open-update-request"
          class="inline-flex items-center gap-1 px-3 py-2 rounded-full text-xs sm:text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition cursor-pointer"
          title="Fale conosco"
        >
          Fale conosco
        </button>

        <button
          type="button"
          id="btn-header-inicio"
          class="hidden items-center gap-1 px-3 py-2 rounded-full text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition cursor-pointer"
        >
          Início
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================
       CONTEÚDO PRINCIPAL (3 TELAS)
       ========================================================= -->
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10 flex flex-col">

    <!-- 1. TELA INICIAL: EXCLUSIVAMENTE OS DOIS BOTÕES GRANDES -->
    <section id="view-inicio" class="flex-1 flex flex-col items-center justify-center my-auto py-8 fade-in">
      <div class="w-full max-w-xl grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
        <!-- Botão Encontrar Profissional -->
        <button
          type="button"
          id="btn-go-encontrar"
          class="group relative flex flex-col items-center justify-center text-center p-8 sm:p-10 rounded-3xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white shadow-lg shadow-emerald-600/20 transition-all cursor-pointer min-h-[190px] sm:min-h-[220px]"
        >
          <span class="w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center mb-4 group-hover:scale-105 transition-transform">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <span class="text-xl sm:text-2xl font-bold tracking-tight leading-snug">
            Encontrar Profissional
          </span>
        </button>

        <!-- Botão Cadastrar Profissional -->
        <button
          type="button"
          id="btn-go-cadastrar"
          class="group relative flex flex-col items-center justify-center text-center p-8 sm:p-10 rounded-3xl bg-white hover:bg-slate-50 active:scale-[0.99] text-slate-900 border-2 border-slate-200 hover:border-emerald-500 shadow-lg shadow-slate-200/50 transition-all cursor-pointer min-h-[190px] sm:min-h-[220px]"
        >
          <span class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4 group-hover:scale-105 transition-transform">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
          </span>
          <span class="text-xl sm:text-2xl font-bold tracking-tight leading-snug">
            Cadastrar Profissional
          </span>
        </button>
      </div>

    </section>

    <!-- 2. TELA ENCONTRAR PROFISSIONAL -->
    <section id="view-encontrar" class="hidden flex-col fade-in">
      <!-- Barra superior discreta -->
      <div class="flex items-center justify-between gap-2 mb-5">
        <button
          type="button"
          data-back-home
          class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 py-2 px-2.5 -ml-2.5 rounded-xl hover:bg-slate-200/60 transition cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          Voltar ao início
        </button>

        <div class="relative flex items-center gap-2"></div>
      </div>

      <!-- Campo de busca unificado + Autocomplete -->
      <div class="relative w-full">
        <div class="relative flex items-center">
          <span class="absolute left-4 text-slate-400 pointer-events-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input
            type="text"
            id="search-input"
            autocomplete="off"
            placeholder="Digite aqui..."
            class="w-full pl-12 pr-12 py-4 text-base sm:text-lg bg-white border-2 border-slate-200 focus:border-emerald-500 rounded-2xl shadow-sm outline-none transition placeholder:text-slate-400"
          />
          <button
            type="button"
            id="btn-clear-search"
            class="hidden absolute right-3.5 w-8 h-8 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition cursor-pointer"
            title="Limpar pesquisa"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Dropdown de sugestões da busca -->
        <ul
          id="search-suggestions"
          class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-64 overflow-y-auto z-20 divide-y divide-slate-100"
        ></ul>
      </div>

      <!-- Dica discreta em itálico (some suavemente ao digitar) -->
      <p
        id="search-hint"
        class="mt-2.5 px-1 text-xs sm:text-sm italic text-slate-400 transition-all duration-200"
      >
        Pesquise por cidade, profissão ou nome do profissional
      </p>

      <p
        id="city-total-hint"
        class="hidden mt-1 px-1 text-right text-xs sm:text-sm italic text-slate-400"
      ></p>

      <div id="city-detail-search-wrapper" class="hidden mt-3 relative w-full">
        <input
          type="text"
          id="city-detail-search-input"
          autocomplete="off"
          placeholder="Filtrar na cidade por nome ou profissão..."
          class="w-full px-4 py-3 text-sm sm:text-base bg-white border border-slate-200 focus:border-emerald-500 rounded-2xl shadow-sm outline-none transition placeholder:text-slate-400"
        />
      </div>

      <!-- Container de resultados (vazio inicialmente) -->
      <div id="search-results-wrapper" class="hidden mt-6 flex-col gap-3">
        <div class="flex items-center justify-between px-1">
          <span id="results-count" class="text-xs font-semibold uppercase tracking-wider text-slate-400"></span>
        </div>
        <div id="results-list" class="grid grid-cols-1 gap-3.5"></div>
      </div>

    </section>

    <!-- 3. TELA CADASTRAR PROFISSIONAL -->
    <section id="view-cadastrar" class="hidden flex-col fade-in">
      <!-- Barra superior discreta -->
      <div class="mb-5">
        <button
          type="button"
          data-back-home
          class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 py-2 px-2.5 -ml-2.5 rounded-xl hover:bg-slate-200/60 transition cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          Voltar ao início
        </button>
      </div>

      <!-- Card do Formulário -->
      <div id="register-form-card" class="bg-white border border-slate-200/90 rounded-3xl p-5 sm:p-8 shadow-sm">
        <form id="form-cadastro" novalidate class="space-y-5">
          <!-- Campo: Nome -->
          <div>
            <label for="input-nome" class="block text-sm font-semibold text-slate-700 mb-1.5">
              Nome <span class="text-rose-500">*</span>
            </label>
            <input
              type="text"
              id="input-nome"
              name="nome"
              required
              placeholder="Seu nome completo"
              class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition text-base"
            />
            <p id="err-nome" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
          </div>

          <!-- Campo: Profissão + Opção de cadastrar nova profissão -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="select-profissao" class="block text-sm font-semibold text-slate-700">
                Profissão <span class="text-rose-500">*</span>
              </label>
              <button
                type="button"
                id="btn-toggle-new-prof"
                class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 cursor-pointer"
              >
                + Nova profissão
              </button>
            </div>

            <select
              id="select-profissao"
              name="profissao"
              class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition text-base bg-white"
            >
              <option value="">Selecione sua profissão...</option>
            </select>

            <!-- Mini-campo inline para criar nova profissão -->
            <div id="new-prof-box" class="hidden mt-2.5 p-3.5 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-2.5">
              <label for="input-new-prof" class="block text-xs font-semibold text-emerald-900">
                Nome da nova profissão:
              </label>
              <div class="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  id="input-new-prof"
                  placeholder="Ex.: Serralheiro, Gesseiro, Técnico de TI..."
                  class="flex-1 px-3.5 py-2.5 rounded-xl border border-emerald-300 bg-white focus:border-emerald-600 outline-none text-sm"
                />
                <div class="flex gap-2">
                  <button
                    type="button"
                    id="btn-save-new-prof"
                    class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold transition cursor-pointer"
                  >
                    Adicionar
                  </button>
                  <button
                    type="button"
                    id="btn-cancel-new-prof"
                    class="px-3 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 text-sm font-medium transition cursor-pointer"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
            <p id="err-profissao" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
          </div>

          <!-- Campo: Cidade com Autocomplete -->
          <div class="relative">
            <label for="input-cidade" class="block text-sm font-semibold text-slate-700 mb-1.5">
              Cidade <span class="text-rose-500">*</span>
            </label>
            <input
              type="text"
              id="input-cidade"
              name="cidade"
              required
              autocomplete="off"
              placeholder="Digite o nome da sua cidade..."
              class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition text-base"
            />
            <ul
              id="city-suggestions"
              class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-56 overflow-y-auto z-20 divide-y divide-slate-100"
            ></ul>
            <p id="err-cidade" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
          </div>

          <!-- Campo: WhatsApp com DDD (só números) -->
          <div>
            <label for="input-whatsapp" class="block text-sm font-semibold text-slate-700 mb-1.5">
              WhatsApp com DDD (só números) <span class="text-rose-500">*</span>
            </label>
            <input
              type="tel"
              id="input-whatsapp"
              name="whatsapp"
              inputmode="numeric"
              maxlength="11"
              required
              placeholder="Ex.: 11999998888"
              class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition text-base tracking-wide"
            />
            <p id="err-whatsapp" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
          </div>

          <!-- Caixa obrigatória de autorização -->
          <div class="pt-1">
            <label class="flex items-start gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-200/90 cursor-pointer hover:bg-slate-100/70 transition">
              <input
                type="checkbox"
                id="check-autorizo"
                required
                class="mt-0.5 w-5 h-5 rounded-md border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer"
              />
              <span class="text-sm text-slate-700 font-medium leading-snug select-none">
                Autorizo divulgar meu nome e WhatsApp neste app <span class="text-rose-500">*</span>
              </span>
            </label>
            <p id="err-autorizo" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
          </div>

          <!-- Botão Enviar -->
          <button
            type="submit"
            id="btn-submit-cadastro"
            class="w-full py-4 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold text-base sm:text-lg shadow-md shadow-emerald-600/20 transition cursor-pointer flex items-center justify-center gap-2"
          >
            <span id="submit-btn-text">Salvar Cadastro</span>
          </button>
        </form>
      </div>

      <!-- Tela de Confirmação após cadastro -->
      <div id="register-success-card" class="hidden bg-white border border-emerald-200 rounded-3xl p-6 sm:p-10 shadow-sm text-center fade-in">
        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
          <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-2">Cadastro realizado com sucesso!</h2>
        <p id="register-sync-note" class="text-sm text-slate-600 mb-6">
          Seus dados já estão disponíveis na busca.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <button
            type="button"
            id="btn-success-search"
            class="py-3.5 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm sm:text-base transition cursor-pointer"
          >
            Buscar agora
          </button>
          <button
            type="button"
            id="btn-success-another"
            class="py-3.5 px-6 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm sm:text-base transition cursor-pointer"
          >
            Cadastrar outro
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal de Solicitação de Alteração de Cadastro -->
  <div
    id="update-request-modal"
    class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto"
    role="dialog"
    aria-modal="true"
  >
    <div class="w-full max-w-lg max-h-[88vh] overflow-y-auto bg-white rounded-3xl border border-slate-200 shadow-xl p-5 sm:p-6">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h3 class="text-base sm:text-lg font-bold text-slate-900">Solicitar alteração de cadastro</h3>
          <p class="text-xs text-slate-500 mt-1">Seu pedido será analisado antes da atualização.</p>
        </div>
        <button
          type="button"
          id="btn-close-update-request-modal"
          class="w-9 h-9 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition cursor-pointer"
          title="Fechar"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="update-request-form" class="mt-5 space-y-4" novalidate>
        <input type="hidden" id="update-request-professional-id" />
        <input type="hidden" id="update-request-professional-name" />
        <input type="hidden" id="update-request-professional-phone" />

        <div>
          <label for="update-request-kind" class="block text-sm font-semibold text-slate-700 mb-1.5">Tipo de solicitação <span class="text-rose-500">*</span></label>
          <select
            id="update-request-kind"
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm bg-white"
          >
            <option value="alteracao">Alteração de cadastro</option>
            <option value="remocao">Remoção de cadastro</option>
          </select>
          <p id="err-update-kind" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div class="relative">
          <label for="update-request-contact-search" class="block text-sm font-semibold text-slate-700 mb-1.5">Pesquisar contato cadastrado <span class="text-rose-500">*</span></label>
          <input
            type="text"
            id="update-request-contact-search"
            autocomplete="off"
            placeholder="Digite nome, profissão, cidade ou telefone..."
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm"
          />
          <ul
            id="update-request-contact-suggestions"
            class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-56 overflow-y-auto z-20 divide-y divide-slate-100"
          ></ul>
          <p id="err-update-professional-select" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div id="update-request-selected-professional" class="hidden rounded-2xl border border-emerald-200 bg-emerald-50/60 px-4 py-3 text-xs sm:text-sm text-slate-700">
          <p><strong>Selecionado:</strong> <span id="update-request-selected-name">-</span></p>
          <p class="mt-1"><strong>Contato:</strong> <span id="update-request-selected-phone">-</span></p>
        </div>

        <div>
          <label for="update-request-requester-name" class="block text-sm font-semibold text-slate-700 mb-1.5">Seu nome <span class="text-rose-500">*</span></label>
          <input
            type="text"
            id="update-request-requester-name"
            placeholder="Ex.: Maria Silva"
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm"
          />
          <p id="err-update-requester-name" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div id="update-request-field-group">
          <label for="update-request-field" class="block text-sm font-semibold text-slate-700 mb-1.5">Campo para alteração <span class="text-rose-500">*</span></label>
          <select
            id="update-request-field"
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm bg-white"
          >
            <option value="">Selecione um campo...</option>
            <option value="nome">Nome</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="profissao">Profissão</option>
            <option value="cidade">Cidade</option>
            <option value="outro">Outro</option>
          </select>
          <p id="err-update-field" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div id="update-request-value-group">
          <label for="update-request-value" class="block text-sm font-semibold text-slate-700 mb-1.5">Novo valor sugerido <span class="text-rose-500">*</span></label>
          <input
            type="text"
            id="update-request-value"
            placeholder="Ex.: João da Silva / 11999998888"
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm"
          />
          <p id="err-update-value" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div>
          <label for="update-request-message" class="block text-sm font-semibold text-slate-700 mb-1.5">Mensagem / motivo (opcional)</label>
          <textarea
            id="update-request-message"
            rows="4"
            maxlength="700"
            placeholder="Explique rapidamente o que está incorreto no cadastro."
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm resize-y"
          ></textarea>
          <p id="err-update-message" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div>
          <label for="update-request-contact" class="block text-sm font-semibold text-slate-700 mb-1.5">Seu telefone para contato <span class="text-rose-500">*</span></label>
          <input
            type="tel"
            id="update-request-contact"
            inputmode="numeric"
            maxlength="11"
            placeholder="WhatsApp com DDD"
            class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-500 outline-none transition text-sm"
          />
          <p id="err-update-contact" class="hidden mt-1.5 text-xs font-medium text-rose-600"></p>
        </div>

        <div id="update-request-removal-consent-group" class="hidden rounded-2xl border border-slate-200 bg-slate-50 p-3.5">
          <label class="flex items-start gap-2.5 cursor-pointer select-none">
            <input
              type="checkbox"
              id="update-request-removal-consent"
              class="mt-0.5 w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
            />
            <span class="text-xs sm:text-sm text-slate-700 leading-relaxed">
              Eu afirmo que tenho direito de solicitar a remoção deste cadastro, por ser o titular do contato ou representante autorizado da pessoa cadastrada.
            </span>
          </label>
          <p id="err-update-removal-consent" class="hidden mt-2 text-xs font-medium text-rose-600"></p>
        </div>

        <div class="pt-1 flex items-center gap-2">
          <button
            type="submit"
            id="btn-send-update-request"
            class="flex-1 py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition cursor-pointer"
          >
            Enviar pedido
          </button>
          <button
            type="button"
            id="btn-cancel-update-request"
            class="py-3.5 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition cursor-pointer"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div
  <!-- Toast discreto para feedback de cópia e sincronização -->
  <div
    id="toast-banner"
    class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-slate-900 text-white text-xs sm:text-sm font-medium shadow-lg"
  ></div>

  <!-- =========================================================
       JAVASCRIPT DA APLICAÇÃO
       ========================================================= -->
  <script src="./app.constants.js"></script>
  <script src="./app.utils.js"></script>
  <script src="./app.register.js"></script>
  <script src="./app.js"></script>
</body>
</html>
